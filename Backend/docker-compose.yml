services:
  postgres:
    image: postgres:17
    container_name: railticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: railticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - railticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railticket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  railticket_pgdata:
